<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EXIF Overlay Generator | Adlai Dyson | Fused Frame Photography</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Free tool to overlay camera settings (EXIF) onto images with custom branding.">

  <!-- Favicon -->
  <link rel="icon" href="https://cdn-eu.fusedframe.co.uk/main-logos/jpg/squarefavicon-nocircle.jpg" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94fdf8; }

    /* Range Input Styling */
    input[type=range] { -webkit-appearance: none; background: transparent; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
      background: #94fdf8; cursor: pointer; margin-top: -6px; border: 2px solid #1e293b;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px;
    }
    
    /* Loader */
    .loader {
      border: 4px solid #1e293b; border-radius: 50%; border-top: 4px solid #94fdf8;
      width: 24px; height: 24px; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Checkerboard Pattern for transparent areas */
    .checkerboard {
        background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), linear-gradient(-45deg, #1e293b 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1e293b 75%), linear-gradient(-45deg, transparent 75%, #1e293b 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- Header -->
  <header class="py-3 px-6 bg-slate-950 border-b border-slate-800 flex justify-between items-center z-50 shadow-md shrink-0 h-16">
    <div class="flex items-center gap-4">
      <a href="https://www.fusedframe.co.uk" class="flex items-center gap-3 hover:opacity-80 transition">
        <img src="https://cdn-eu.fusedframe.co.uk/main-logos/png/squarelogo-light-crop.png" alt="Fused Frame Photography" class="h-8 w-auto" />
        <span class="text-xs text-slate-400 border-l border-slate-700 pl-3 hidden sm:block">Return to Main Site</span>
      </a>
      <h1 class="text-lg font-bold text-slate-100 hidden md:block border-l border-slate-700 pl-3">EXIF Overlay Generator</h1>
    </div>
    <div class="flex gap-3">
        <button onclick="document.getElementById('fileInput').click()" class="bg-[#94fdf8] text-slate-950 px-4 py-2 rounded-lg text-sm font-bold hover:bg-[#6ee7e2] transition flex items-center gap-2">
            <i data-lucide="upload" class="w-4 h-4"></i> Upload Images
        </button>
        <input type="file" id="fileInput" multiple accept="image/*" class="hidden" onchange="handleFiles(this.files)">
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex-grow flex flex-row overflow-hidden relative">
    
    <!-- LEFT SIDEBAR: Controls (Full Height) -->
    <aside class="w-80 lg:w-96 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 z-30 overflow-y-auto custom-scrollbar h-full">
      <div class="p-4 border-b border-slate-800 bg-slate-900 sticky top-0 z-10 space-y-2 shadow-sm">
        <div class="flex justify-between items-center">
             <h2 class="font-bold text-[#94fdf8]">Editor</h2>
             <div class="flex gap-2">
                 <button onclick="exportSettings()" title="Export Settings (JSON)" class="text-slate-400 hover:text-[#94fdf8]"><i data-lucide="save" class="w-4 h-4"></i></button>
                 <button onclick="document.getElementById('importInput').click()" title="Import Settings (JSON)" class="text-slate-400 hover:text-[#94fdf8]"><i data-lucide="file-up" class="w-4 h-4"></i></button>
                 <input type="file" id="importInput" accept=".json" class="hidden" onchange="importSettings(this.files)">
             </div>
        </div>
        <button onclick="applyStyleToAll()" class="w-full text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 rounded transition border border-slate-700" title="Apply visual settings (blur, color, size) to all images">
            Sync Style to All Images
        </button>
      </div>

      <!-- No Image Selected State -->
      <div id="no-image-msg" class="p-8 text-center text-slate-500 mt-10">
        <i data-lucide="image" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
        <p>Upload images to start.</p>
      </div>

      <!-- Controls Container -->
      <div id="controls-container" class="hidden p-4 space-y-6 pb-20">
        
        <!-- Section: Content -->
        <div class="space-y-3">
            <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Overlay Data</h3>
            
            <!-- Helper function to generate row HTML -->
            <div id="content-rows" class="space-y-3">
                <!-- Rows injected via JS for cleaner code -->
            </div>

            <div class="pt-2 border-t border-slate-800 mt-2">
                 <div class="flex items-center gap-3 mb-2">
                    <input type="checkbox" id="check-show-copyright" class="accent-[#94fdf8] h-4 w-4 shrink-0" onchange="updateCurrent('showCopyright', this.checked)">
                    <span class="text-xs font-bold text-slate-300 w-20 shrink-0">Copyright</span>
                    <input type="text" id="input-copyright" class="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-xs text-white focus:border-[#94fdf8] outline-none" oninput="updateCurrent('copyright', this.value)">
                </div>
            </div>
        </div>

        <hr class="border-slate-800">

        <!-- Section: Layout -->
        <div class="space-y-3">
             <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Position</h3>
             <div class="grid grid-cols-2 gap-2 max-w-[120px]">
                 <button onclick="updateCurrent('position', 'top-left')" id="btn-pos-top-left" class="h-10 border border-slate-600 rounded bg-slate-800 hover:bg-slate-700 hover:border-[#94fdf8] transition flex items-start justify-start p-1"><div class="w-2 h-2 bg-current rounded-sm"></div></button>
                 <button onclick="updateCurrent('position', 'top-right')" id="btn-pos-top-right" class="h-10 border border-slate-600 rounded bg-slate-800 hover:bg-slate-700 hover:border-[#94fdf8] transition flex items-start justify-end p-1"><div class="w-2 h-2 bg-current rounded-sm"></div></button>
                 <button onclick="updateCurrent('position', 'bottom-left')" id="btn-pos-bottom-left" class="h-10 border border-slate-600 rounded bg-slate-800 hover:bg-slate-700 hover:border-[#94fdf8] transition flex items-end justify-start p-1"><div class="w-2 h-2 bg-current rounded-sm"></div></button>
                 <button onclick="updateCurrent('position', 'bottom-right')" id="btn-pos-bottom-right" class="h-10 border border-slate-600 rounded bg-slate-800 hover:bg-slate-700 hover:border-[#94fdf8] transition flex items-end justify-end p-1"><div class="w-2 h-2 bg-current rounded-sm"></div></button>
             </div>
        </div>

        <hr class="border-slate-800">

        <!-- Section: Appearance -->
        <div class="space-y-4">
            <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Style</h3>
            
            <div class="grid grid-cols-2 gap-4">
                 <div>
                    <label class="text-xs text-slate-400 block mb-1">Card Color</label>
                    <div class="flex gap-2 items-center">
                        <input type="color" id="color-card" class="h-6 w-6 bg-transparent border-0 cursor-pointer p-0" oninput="updateCurrent('cardColor', this.value)">
                        <input type="text" id="hex-card" class="w-full bg-slate-950 border border-slate-700 rounded text-xs px-2 py-1 text-slate-300 uppercase" onchange="updateCurrent('cardColor', this.value)">
                    </div>
                </div>
                <div>
                     <label class="text-xs text-slate-400 block mb-1">Card Opacity</label>
                     <div class="flex items-center justify-between">
                         <span id="val-card-opacity" class="text-[#94fdf8] text-xs">60%</span>
                     </div>
                     <input type="range" id="range-card-opacity" min="0" max="100" step="5" class="w-full mt-1" oninput="updateCurrent('cardOpacity', this.value)">
                </div>
            </div>
            
             <div>
                <div class="flex justify-between text-xs mb-1"><span class="text-slate-400">Corner Radius</span><span id="val-rounding" class="text-[#94fdf8]">10</span></div>
                <input type="range" id="range-rounding" min="0" max="100" step="1" class="w-full" oninput="updateCurrent('cardRounding', this.value)">
            </div>
            
            <div>
                <div class="flex justify-between text-xs mb-1"><span class="text-slate-400">Scale</span><span id="val-font" class="text-[#94fdf8]">1.0x</span></div>
                <input type="range" id="range-font" min="0.5" max="2.0" step="0.1" class="w-full" oninput="updateCurrent('fontScale', this.value)">
            </div>

            <div>
                <div class="flex justify-between text-xs mb-1"><span class="text-slate-400">Background Blur</span><span id="val-blur" class="text-[#94fdf8]">6px</span></div>
                <input type="range" id="range-blur" min="0" max="50" step="1" class="w-full" oninput="updateCurrent('blur', this.value)">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Text Color</label>
                    <div class="flex gap-2 items-center">
                        <input type="color" id="color-text" class="h-6 w-6 bg-transparent border-0 cursor-pointer p-0" oninput="updateCurrent('textColor', this.value)">
                        <input type="text" id="hex-text" class="w-full bg-slate-950 border border-slate-700 rounded text-xs px-2 py-1 text-slate-300 uppercase" onchange="updateCurrent('textColor', this.value)">
                    </div>
                </div>
                <div>
                     <label class="text-xs text-slate-400 block mb-1">Accent</label>
                    <div class="flex gap-2 items-center">
                        <input type="color" id="color-accent" class="h-6 w-6 bg-transparent border-0 cursor-pointer p-0" oninput="updateCurrent('accentColor', this.value)">
                        <input type="text" id="hex-accent" class="w-full bg-slate-950 border border-slate-700 rounded text-xs px-2 py-1 text-slate-300 uppercase" onchange="updateCurrent('accentColor', this.value)">
                    </div>
                </div>
            </div>
        </div>
      </div>
    </aside>

    <!-- RIGHT COLUMN: Canvas & Filmstrip -->
    <div class="flex-grow flex flex-col min-w-0 bg-slate-950 h-full relative">
        
        <!-- CENTER: Canvas Preview -->
        <main class="flex-grow flex flex-col relative overflow-hidden bg-[#0b1120] checkerboard z-0">
            <!-- Toolbar -->
            <div class="absolute top-4 left-1/2 -translate-x-1/2 z-20 flex gap-2 bg-slate-900/90 backdrop-blur rounded-full px-2 py-1.5 border border-slate-700 shadow-xl">
                 <button onclick="changeZoom(-0.1)" class="p-1.5 hover:text-[#94fdf8] transition" title="Zoom Out"><i data-lucide="minus" class="w-4 h-4"></i></button>
                 <span class="text-xs font-mono w-12 text-center py-1.5" id="zoom-display">Fit</span>
                 <button onclick="changeZoom(0.1)" class="p-1.5 hover:text-[#94fdf8] transition" title="Zoom In"><i data-lucide="plus" class="w-4 h-4"></i></button>
                 <div class="w-px h-4 bg-slate-700 my-auto mx-1"></div>
                 <button onclick="resetZoom()" class="p-1.5 hover:text-[#94fdf8] transition" title="Fit to Screen"><i data-lucide="maximize" class="w-4 h-4"></i></button>
            </div>

            <div class="absolute top-4 right-4 z-20 flex gap-2">
                <button onclick="downloadCurrent()" class="bg-slate-800/80 backdrop-blur text-white px-3 py-2 rounded-lg text-sm hover:bg-slate-700 border border-slate-600 shadow-lg flex items-center gap-2 transition">
                    <i data-lucide="download" class="w-4 h-4"></i> Save
                </button>
                 <button onclick="downloadAll()" class="bg-[#94fdf8] text-slate-950 px-3 py-2 rounded-lg text-sm font-bold hover:bg-[#6ee7e2] shadow-lg flex items-center gap-2 transition">
                    <i data-lucide="archive" class="w-4 h-4"></i> ZIP All
                </button>
            </div>

            <!-- Canvas Container -->
            <div class="w-full h-full flex items-center justify-center p-8 overflow-hidden" id="canvas-wrapper">
                <canvas id="previewCanvas" class="shadow-2xl border border-slate-700 rounded-sm hidden transition-transform duration-200 ease-out origin-center" style="max-width: 100%; max-height: 100%; object-fit: contain;"></canvas>
                <div id="empty-state" class="text-center text-slate-600 select-none">
                    <i data-lucide="camera" class="w-24 h-24 mx-auto mb-4 opacity-20"></i>
                    <h2 class="text-xl font-bold opacity-50">Ready to Create</h2>
                    <p class="text-sm opacity-40">Drag & drop or click Upload to begin</p>
                </div>
            </div>
            
            <!-- Processing Overlay -->
            <div id="processing-overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
                 <div class="loader mb-4"></div>
                 <p class="text-[#94fdf8] font-bold animate-pulse" id="processing-text">Processing...</p>
            </div>
        </main>

        <!-- BOTTOM: Filmstrip -->
        <footer class="h-36 bg-slate-900 border-t border-slate-800 flex flex-col shrink-0 z-10 shadow-[0_-5px_15px_rgba(0,0,0,0.3)]">
            <div class="px-4 py-2 border-b border-slate-800 flex justify-between items-center bg-slate-900">
                <span class="text-xs text-slate-400 font-mono" id="status-counter">0 images loaded</span>
                <button onclick="clearAll()" class="text-xs text-red-400 hover:text-red-300 flex items-center gap-1 uppercase tracking-wide font-bold">
                    <i data-lucide="trash-2" class="w-3 h-3"></i> Clear
                </button>
            </div>
            <div class="flex-grow overflow-x-auto overflow-y-hidden p-3 flex gap-3 items-center whitespace-nowrap min-h-0 custom-scrollbar" id="filmstrip">
                <!-- Thumbnails injected here -->
            </div>
        </footer>
    </div>
  </div>

<script>
    // --- ICONS ---
    const ICONS = {
        aperture: "https://cdn-eu.fusedframe.co.uk/services/exif-overlay-generator/icons/aperture.png",
        shutter: "https://cdn-eu.fusedframe.co.uk/services/exif-overlay-generator/icons/exposure.png",
        iso: "https://cdn-eu.fusedframe.co.uk/services/exif-overlay-generator/icons/iso.png",
        focal: "https://cdn-eu.fusedframe.co.uk/services/exif-overlay-generator/icons/focal-length.png",
        camera: "https://cdn-eu.fusedframe.co.uk/services/exif-overlay-generator/icons/camera.png",
        lens: "https://cdn-eu.fusedframe.co.uk/services/exif-overlay-generator/icons/lens.png",
    };
    const loadedIcons = {};

    // --- APP STATE ---
    let images = []; 
    let selectedId = null;
    let currentZoom = 1.0;
    
    // Default Settings
    let userDefaults = {
        blur: 6,
        cardOpacity: 60,
        cardRounding: 10,
        cardColor: '#1e374d',
        fontScale: 1.0,
        textColor: '#ffffff',
        accentColor: '#94fdf8',
        position: 'bottom-left',
        // Toggles
        showAperture: true,
        showShutter: true,
        showIso: true,
        showFocal: true,
        showDesc: true,
        showDate: true,
        showCamera: true,
        showLens: true,
        showCopyright: true,
        // Text Content
        txtAperture: '',
        txtShutter: '',
        txtIso: '',
        txtFocal: '',
        txtDesc: '',
        txtDate: '',
        txtCamera: '',
        txtLens: '',
        copyright: '© Adlai Dyson | Fused Frame Photography'
    };

    // Load defaults
    const savedDefaults = localStorage.getItem('adffp_exif_defaults_v3');
    if(savedDefaults) {
        try {
            userDefaults = { ...userDefaults, ...JSON.parse(savedDefaults) };
        } catch(e) { console.error("Failed to load settings", e); }
    }

    // --- DOM ELEMENTS ---
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const filmstrip = document.getElementById('filmstrip');
    const controlsContainer = document.getElementById('controls-container');
    const noImageMsg = document.getElementById('no-image-msg');
    const emptyState = document.getElementById('empty-state');
    const statusCounter = document.getElementById('status-counter');
    const processingOverlay = document.getElementById('processing-overlay');
    const processingText = document.getElementById('processing-text');
    const contentRows = document.getElementById('content-rows');

    // Init
    lucide.createIcons();
    preloadIcons();
    buildSidebarUI();

    function preloadIcons() {
        Object.keys(ICONS).forEach(key => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = ICONS[key];
            loadedIcons[key] = img;
        });
    }

    function buildSidebarUI() {
        const rows = [
            { id: 'Aperture', label: 'Aperture', icon: 'aperture' },
            { id: 'Shutter', label: 'Exposure', icon: 'shutter' },
            { id: 'Iso', label: 'ISO', icon: 'iso' },
            { id: 'Focal', label: 'Focal Length', icon: 'focal' },
            { id: 'Divider', label: 'Divider Line', isDivider: true },
            { id: 'Desc', label: 'Description', placeholder: 'Short description...' },
            { id: 'Date', label: 'Time & Date', icon: 'clock' },
            { id: 'Camera', label: 'Camera', icon: 'camera' },
            { id: 'Lens', label: 'Lens', icon: 'lens' }
        ];

        let html = '';
        rows.forEach(r => {
            if(r.isDivider) {
                html += `
                <div class="flex items-center gap-3 py-1 opacity-70">
                    <div class="w-4 h-4"></div>
                    <div class="flex-grow h-px bg-slate-600"></div>
                    <span class="text-[10px] text-slate-500 uppercase">Accent Divider</span>
                    <div class="flex-grow h-px bg-slate-600"></div>
                </div>`;
                return;
            }

            const keyShow = `show${r.id}`;
            const keyTxt = `txt${r.id}`;
            
            html += `
            <div class="flex items-center gap-3">
                <input type="checkbox" id="check-${keyShow}" class="accent-[#94fdf8] h-4 w-4 shrink-0" onchange="updateCurrent('${keyShow}', this.checked)">
                <span class="text-xs font-bold text-slate-300 w-20 shrink-0 truncate" title="${r.label}">${r.label}</span>
                <input type="text" id="input-${keyTxt}" class="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-xs text-white focus:border-[#94fdf8] outline-none" placeholder="${r.placeholder || r.label}" oninput="updateCurrent('${keyTxt}', this.value)">
            </div>`;
        });
        contentRows.innerHTML = html;
    }

    // --- FILE HANDLING ---
    function handleFiles(files) {
        if (!files.length) return;
        
        processingOverlay.classList.remove('hidden');
        processingText.innerText = `Loading ${files.length} images...`;

        let loadedCount = 0;
        const total = files.length;

        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    EXIF.getData(img, function() {
                        addContentImage(file, img, this);
                        loadedCount++;
                        if (loadedCount === total) {
                            processingOverlay.classList.add('hidden');
                            if (selectedId === null && images.length > 0) {
                                selectImage(images[0].id);
                            }
                        }
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function addContentImage(file, imgElement, exifData) {
        const id = Date.now() + Math.random().toString(16).slice(2);
        const extracted = parseExif(exifData);
        
        // Use current userDefaults for new image, but populate text fields with EXIF
        const settings = { 
            ...userDefaults,
            txtAperture: extracted.aperture,
            txtShutter: extracted.shutter,
            txtIso: extracted.iso,
            txtFocal: extracted.focal,
            txtCamera: extracted.camera,
            txtLens: extracted.lens,
            txtDate: extracted.date,
            txtDesc: userDefaults.txtDesc // Keep desc empty or default
        };

        const imageObj = { id, file, imgElement, settings };
        images.push(imageObj);
        createThumbnail(imageObj);
        updateCounter();
    }

    function parseExif(exif) {
        const getTag = (tag) => exif.exifdata ? exif.exifdata[tag] : null;
        let camera = getTag('Model') || 'Unknown Camera';
        camera = camera.replace(/NIKON/i, 'Nikon').replace(/CANON/i, 'Canon').replace(/SONY/i, 'Sony').replace(/CORPORATION/i, '').replace(/DIGITAL CAMERA/i, '');
        
        let lens = getTag('LensModel') || '';
        
        let iso = getTag('ISOSpeedRatings') || '--';
        let aperture = getTag('FNumber') ? `f/${getTag('FNumber')}` : 'f/--';
        let focal = getTag('FocalLength') ? `${Math.round(getTag('FocalLength'))}mm` : '--mm';
        
        let shutter = getTag('ExposureTime');
        if (shutter) {
            shutter = (shutter < 1) ? `1/${Math.round(1/shutter)}s` : `${shutter}s`;
        } else {
            shutter = '--';
        }

        let date = getTag('DateTimeOriginal') || '';
        if(date) {
            // Exif format is YYYY:MM:DD HH:MM:SS
            const parts = date.split(' ');
            if(parts.length > 1) {
                // Formatting to DD/MM/YYYY HH:MM
                const d = parts[0].split(':');
                const t = parts[1].split(':');
                date = `${d[2]}/${d[1]}/${d[0]} ${t[0]}:${t[1]}`;
            }
        }

        return { camera, iso, aperture, focal, shutter, lens, date };
    }

    // --- THUMBNAIL UI ---
    function createThumbnail(imgObj) {
        const div = document.createElement('div');
        div.className = `relative w-24 h-24 shrink-0 cursor-pointer border-4 border-slate-800 rounded-lg overflow-hidden group hover:border-slate-600 transition shadow-md`;
        div.id = `thumb-${imgObj.id}`;
        div.onclick = () => selectImage(imgObj.id);

        const img = document.createElement('img');
        img.src = imgObj.imgElement.src;
        img.className = "w-full h-full object-cover opacity-70 group-hover:opacity-100 transition";
        
        div.appendChild(img);
        filmstrip.appendChild(div);
        
        // Auto scroll to new item
        filmstrip.scrollLeft = filmstrip.scrollWidth;
    }

    // --- SELECTION LOGIC ---
    function selectImage(id) {
        selectedId = id;
        
        document.querySelectorAll('#filmstrip > div').forEach(d => {
            d.classList.remove('border-[#94fdf8]', 'ring-2', 'ring-[#94fdf8]', 'ring-offset-2', 'ring-offset-slate-900');
            d.classList.add('border-slate-800');
            d.querySelector('img').classList.add('opacity-70');
        });
        const activeThumb = document.getElementById(`thumb-${id}`);
        if (activeThumb) {
            activeThumb.classList.remove('border-slate-800');
            activeThumb.classList.add('border-[#94fdf8]', 'ring-2', 'ring-[#94fdf8]', 'ring-offset-2', 'ring-offset-slate-900');
            activeThumb.querySelector('img').classList.remove('opacity-70');
            activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }

        controlsContainer.classList.remove('hidden');
        noImageMsg.classList.add('hidden');
        emptyState.classList.add('hidden');
        canvas.classList.remove('hidden');

        syncInputsToState();
        renderCanvas();
    }

    function syncInputsToState() {
        const img = images.find(i => i.id === selectedId);
        if (!img) return;
        const s = img.settings;

        // Loop through keys to populate
        ['Aperture', 'Shutter', 'Iso', 'Focal', 'Desc', 'Date', 'Camera', 'Lens'].forEach(k => {
            const elTxt = document.getElementById(`input-txt${k}`);
            if(elTxt) elTxt.value = s[`txt${k}`];
            
            const elChk = document.getElementById(`check-show${k}`);
            if(elChk) elChk.checked = s[`show${k}`];
        });

        document.getElementById('input-copyright').value = s.copyright;
        document.getElementById('check-show-copyright').checked = s.showCopyright;

        document.getElementById('range-blur').value = s.blur;
        document.getElementById('val-blur').innerText = s.blur + 'px';
        
        document.getElementById('range-card-opacity').value = s.cardOpacity;
        document.getElementById('val-card-opacity').innerText = s.cardOpacity + '%';

        document.getElementById('range-rounding').value = s.cardRounding;
        document.getElementById('val-rounding').innerText = s.cardRounding;
        
        document.getElementById('range-font').value = s.fontScale;
        document.getElementById('val-font').innerText = s.fontScale + 'x';

        document.getElementById('color-text').value = s.textColor;
        document.getElementById('hex-text').value = s.textColor;
        document.getElementById('color-accent').value = s.accentColor;
        document.getElementById('hex-accent').value = s.accentColor;
        document.getElementById('color-card').value = s.cardColor;
        document.getElementById('hex-card').value = s.cardColor;

        // Position Buttons
        ['top-left', 'top-right', 'bottom-left', 'bottom-right'].forEach(pos => {
            const btn = document.getElementById(`btn-pos-${pos}`);
            if(s.position === pos) {
                btn.classList.add('bg-[#94fdf8]', 'border-[#94fdf8]', 'text-slate-900');
                btn.classList.remove('bg-slate-800', 'border-slate-600');
            } else {
                btn.classList.remove('bg-[#94fdf8]', 'border-[#94fdf8]', 'text-slate-900');
                btn.classList.add('bg-slate-800', 'border-slate-600');
            }
        });
    }

    // --- UPDATE & PERSISTENCE ---
    function updateCurrent(key, value) {
        if (!selectedId) return;
        const img = images.find(i => i.id === selectedId);
        if (!img) return;

        // Type conversion
        if (['blur', 'cardOpacity', 'cardRounding'].includes(key)) value = parseInt(value);
        if (key === 'fontScale') value = parseFloat(value);

        img.settings[key] = value;
        userDefaults[key] = value; // Update defaults for next image
        saveDefaults();

        // UI Feedback for ranges
        if (key === 'blur') document.getElementById('val-blur').innerText = value + 'px';
        if (key === 'cardOpacity') document.getElementById('val-card-opacity').innerText = value + '%';
        if (key === 'cardRounding') document.getElementById('val-rounding').innerText = value;
        if (key === 'fontScale') document.getElementById('val-font').innerText = value + 'x';
        if (key === 'textColor') { document.getElementById('color-text').value = value; document.getElementById('hex-text').value = value; }
        if (key === 'accentColor') { document.getElementById('color-accent').value = value; document.getElementById('hex-accent').value = value; }
        if (key === 'cardColor') { document.getElementById('color-card').value = value; document.getElementById('hex-card').value = value; }
        if (key === 'position') syncInputsToState();

        renderCanvas();
    }
    
    let saveTimeout;
    function saveDefaults() {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            localStorage.setItem('adffp_exif_defaults_v3', JSON.stringify(userDefaults));
        }, 500);
    }
    
    function exportSettings() {
        const json = JSON.stringify(userDefaults, null, 2);
        const blob = new Blob([json], {type: "application/json"});
        saveAs(blob, "fusedframe-settings.json");
    }
    
    function importSettings(files) {
        if(!files.length) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const loaded = JSON.parse(e.target.result);
                // Merge loaded into userDefaults, overwriting existing
                userDefaults = { ...userDefaults, ...loaded };
                saveDefaults(); // Persist
                // Apply to current image if one is selected
                if(selectedId) {
                    const img = images.find(i => i.id === selectedId);
                    // We only want to apply STYLE keys, not CONTENT keys if imported
                    const styleKeys = ['blur', 'cardOpacity', 'cardRounding', 'cardColor', 'fontScale', 'textColor', 'accentColor', 'position'];
                    styleKeys.forEach(k => {
                       if(loaded[k] !== undefined) img.settings[k] = loaded[k]; 
                    });
                    syncInputsToState();
                    renderCanvas();
                }
                alert("Settings imported!");
            } catch(err) {
                alert("Invalid JSON file");
            }
        };
        reader.readAsText(files[0]);
    }

    function applyStyleToAll() {
        if (!selectedId) return;
        const source = images.find(i => i.id === selectedId).settings;
        if(!confirm("Apply current Style (Blur, Opacity, Position, Colors, Toggles) to all images? Content (Text) will be preserved.")) return;

        images.forEach(img => {
            if(img.id === selectedId) return;
            // Copy style props only
            const s = img.settings;
            s.blur = source.blur;
            s.cardOpacity = source.cardOpacity;
            s.cardRounding = source.cardRounding;
            s.cardColor = source.cardColor;
            s.fontScale = source.fontScale;
            s.textColor = source.textColor;
            s.accentColor = source.accentColor;
            s.position = source.position;
            s.showAperture = source.showAperture;
            s.showShutter = source.showShutter;
            s.showIso = source.showIso;
            s.showFocal = source.showFocal;
            s.showDesc = source.showDesc;
            s.showDate = source.showDate;
            s.showCamera = source.showCamera;
            s.showLens = source.showLens;
            s.showCopyright = source.showCopyright;
        });
        alert("Synced!");
        renderCanvas();
    }

    // --- ZOOM ---
    function changeZoom(delta) {
        currentZoom = Math.max(0.1, currentZoom + delta);
        applyZoom();
    }
    function resetZoom() {
        currentZoom = 1.0;
        // Check if image is bigger than container? For "Fit", we usually just reset transforms and let CSS handle contain.
        // Actually, CSS object-fit: contain handles "Fit". 
        // To Zoom, we need to scale the element.
        applyZoom();
    }
    function applyZoom() {
        canvas.style.transform = `scale(${currentZoom})`;
        document.getElementById('zoom-display').innerText = Math.round(currentZoom * 100) + '%';
    }


    // --- RENDER LOGIC (VERTICAL LIST) ---
    function renderCanvas() {
        if (!selectedId) return;
        const imgObj = images.find(i => i.id === selectedId);
        const s = imgObj.settings;
        const baseImg = imgObj.imgElement;
        
        canvas.width = baseImg.naturalWidth;
        canvas.height = baseImg.naturalHeight;
        
        // Improve downsampling/upsampling quality for icons and canvas
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        const w = canvas.width;
        const h = canvas.height;

        // 1. Draw Background
        ctx.save();
        if (s.blur > 0) ctx.filter = `blur(${s.blur * 2}px)`;
        ctx.drawImage(baseImg, 0, 0);
        ctx.restore();

        // 2. Setup Dimensions
        // Use Min Dimension to ensure scaling is consistent across Portrait/Landscape
        const minDim = Math.min(w, h);
        const baseScale = minDim * 0.0016 * s.fontScale; // Adjusted multiplier for minDim
        
        const fontSize = 28 * baseScale; 
        const rowHeight = 45 * baseScale;
        const iconSize = 32 * baseScale;
        const padding = 40 * baseScale;
        const gap = 20 * baseScale;

        // Define Items to Render
        const items = [];
        if(s.showAperture) items.push({ type: 'row', iconKey: 'aperture', text: s.txtAperture });
        if(s.showShutter) items.push({ type: 'row', iconKey: 'shutter', text: s.txtShutter });
        if(s.showIso) items.push({ type: 'row', iconKey: 'iso', text: s.txtIso });
        if(s.showFocal) items.push({ type: 'row', iconKey: 'focal', text: s.txtFocal });
        
        // Divider Check (Only show if items above AND below exist)
        const hasTop = items.length > 0;
        const bottomItems = [];
        if(s.showDesc && s.txtDesc) bottomItems.push({ type: 'text', text: s.txtDesc, bold: true });
        if(s.showDate) bottomItems.push({ type: 'row', iconKey: 'clock', text: s.txtDate });
        if(s.showCamera) bottomItems.push({ type: 'row', iconKey: 'camera', text: s.txtCamera });
        if(s.showLens) bottomItems.push({ type: 'row', iconKey: 'lens', text: s.txtLens });
        
        if(hasTop && bottomItems.length > 0) items.push({ type: 'divider' });
        items.push(...bottomItems);

        if(s.showCopyright) {
            // Add a small spacer before copyright if needed, or just append
            if(items.length > 0) items.push({ type: 'spacer', height: rowHeight * 0.5 });
            items.push({ type: 'copyright', text: s.copyright });
        }

        if(items.length === 0) return; // Nothing to draw

        // 3. Calculate Card Dimensions
        ctx.font = `${fontSize}px "Noto Sans", sans-serif`;
        let maxTextWidth = 0;
        let contentHeight = padding * 2; // Top & Bottom Padding

        items.forEach(item => {
            if(item.type === 'row') {
                const tw = ctx.measureText(item.text).width;
                maxTextWidth = Math.max(maxTextWidth, iconSize + gap + tw);
                contentHeight += rowHeight;
            } else if (item.type === 'text') {
                 ctx.save();
                 if(item.bold) ctx.font = `bold ${fontSize}px "Noto Sans", sans-serif`;
                 const tw = ctx.measureText(item.text).width;
                 maxTextWidth = Math.max(maxTextWidth, tw);
                 ctx.restore();
                 contentHeight += rowHeight;
            } else if (item.type === 'divider') {
                contentHeight += rowHeight; // Space for divider
            } else if (item.type === 'spacer') {
                contentHeight += item.height;
            } else if (item.type === 'copyright') {
                 ctx.save();
                 ctx.font = `${fontSize * 0.7}px "Noto Sans", sans-serif`;
                 const tw = ctx.measureText(item.text).width;
                 maxTextWidth = Math.max(maxTextWidth, tw);
                 ctx.restore();
                 contentHeight += (rowHeight * 0.8);
            }
        });

        const cardWidth = Math.max(minDim * 0.35, maxTextWidth + (padding * 2)); // Dynamic Min Width
        
        // 4. Position Calculation
        const margin = minDim * 0.04;
        let startX, startY;

        switch(s.position) {
            case 'top-left': startX = margin; startY = margin; break;
            case 'top-right': startX = w - cardWidth - margin; startY = margin; break;
            case 'bottom-right': startX = w - cardWidth - margin; startY = h - contentHeight - margin; break;
            case 'bottom-left': startX = margin; startY = h - contentHeight - margin; break;
            default: startX = margin; startY = h - contentHeight - margin;
        }

        // 5. Draw Card
        ctx.save();
        ctx.fillStyle = s.cardColor; // Custom card color
        ctx.globalAlpha = s.cardOpacity / 100;
        const r = s.cardRounding * 2 * baseScale;
        ctx.beginPath();
        ctx.roundRect(startX, startY, cardWidth, contentHeight, r);
        ctx.fill();
        ctx.restore();

        // 6. Draw Items
        let currentY = startY + padding + (rowHeight/2);
        
        ctx.fillStyle = s.textColor;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';

        items.forEach(item => {
            const x = startX + padding;
            
            if(item.type === 'row') {
                // Draw Icon
                if(item.iconKey === 'clock') {
                     // Draw Generic Clock
                     ctx.strokeStyle = s.accentColor; // Use accent color
                     ctx.lineWidth = 2 * baseScale;
                     ctx.beginPath();
                     ctx.arc(x + iconSize/2, currentY, iconSize/2 - (2*baseScale), 0, Math.PI * 2);
                     ctx.stroke();
                     // Hands
                     ctx.beginPath();
                     ctx.moveTo(x + iconSize/2, currentY);
                     ctx.lineTo(x + iconSize/2, currentY - (iconSize/3));
                     ctx.moveTo(x + iconSize/2, currentY);
                     ctx.lineTo(x + iconSize/2 + (iconSize/4), currentY);
                     ctx.stroke();
                } else if (loadedIcons[item.iconKey]) {
                    try {
                        // Tint Icon Logic
                        const tCanvas = document.createElement('canvas');
                        tCanvas.width = iconSize;
                        tCanvas.height = iconSize;
                        const tCtx = tCanvas.getContext('2d');
                        tCtx.drawImage(loadedIcons[item.iconKey], 0, 0, iconSize, iconSize);
                        tCtx.globalCompositeOperation = 'source-in';
                        tCtx.fillStyle = s.accentColor;
                        tCtx.fillRect(0, 0, iconSize, iconSize);
                        
                        ctx.drawImage(tCanvas, x, currentY - iconSize/2);
                    } catch(e) {}
                }
                
                // Draw Text
                ctx.font = `${fontSize}px "Noto Sans", sans-serif`;
                ctx.fillText(item.text, x + iconSize + gap, currentY);
                currentY += rowHeight;

            } else if (item.type === 'text') {
                if(item.bold) ctx.font = `bold ${fontSize}px "Noto Sans", sans-serif`;
                else ctx.font = `${fontSize}px "Noto Sans", sans-serif`;
                
                ctx.fillText(item.text, x, currentY);
                currentY += rowHeight;

            } else if (item.type === 'divider') {
                ctx.strokeStyle = s.accentColor;
                ctx.lineWidth = 3 * baseScale;
                ctx.beginPath();
                ctx.moveTo(x, currentY);
                ctx.lineTo(x + cardWidth - (padding*2), currentY);
                ctx.stroke();
                currentY += rowHeight;

            } else if (item.type === 'spacer') {
                currentY += item.height;
            } else if (item.type === 'copyright') {
                ctx.save();
                ctx.font = `${fontSize * 0.7}px "Noto Sans", sans-serif`;
                ctx.globalAlpha = 0.8;
                ctx.fillText(item.text, x, currentY);
                ctx.restore();
                currentY += (rowHeight * 0.8);
            }
        });
    }

    // --- EXPORT LOGIC ---
    function downloadCurrent() {
        if (!selectedId) return;
        const imgObj = images.find(i => i.id === selectedId);
        // Reset transform before exporting? No, canvas data is separate from CSS transform.
        canvas.toBlob((blob) => {
            saveAs(blob, `fusedframe-${imgObj.settings.txtDesc.replace(/[^a-z0-9]/gi, '-').toLowerCase()}.jpg`);
        }, 'image/jpeg', 0.95);
    }

    async function downloadAll() {
        if (images.length === 0) return;
        processingOverlay.classList.remove('hidden');
        processingText.innerText = "Starting batch process...";
        const zip = new JSZip();
        
        const tempCanvas = document.createElement('canvas');
        const tCtx = tempCanvas.getContext('2d');

        for (let i = 0; i < images.length; i++) {
            const imgObj = images[i];
            const s = imgObj.settings;
            const baseImg = imgObj.imgElement;
            
            processingText.innerText = `Rendering ${i+1}/${images.length}...`;

            // --- REPLICATE RENDER LOGIC ---
            tempCanvas.width = baseImg.naturalWidth;
            tempCanvas.height = baseImg.naturalHeight;
            const w = tempCanvas.width;
            const h = tempCanvas.height;
            const tCtx = tempCanvas.getContext('2d');
            
            tCtx.imageSmoothingEnabled = true;
            tCtx.imageSmoothingQuality = 'high';

            // 1. BG
            tCtx.save();
            if (s.blur > 0) tCtx.filter = `blur(${s.blur * 2}px)`;
            tCtx.drawImage(baseImg, 0, 0);
            tCtx.restore();

            const minDim = Math.min(w, h);
            const baseScale = minDim * 0.0016 * s.fontScale;
            
            const fontSize = 28 * baseScale; 
            const rowHeight = 45 * baseScale;
            const iconSize = 32 * baseScale;
            const padding = 40 * baseScale;
            const gap = 20 * baseScale;

            const items = [];
            if(s.showAperture) items.push({ type: 'row', iconKey: 'aperture', text: s.txtAperture });
            if(s.showShutter) items.push({ type: 'row', iconKey: 'shutter', text: s.txtShutter });
            if(s.showIso) items.push({ type: 'row', iconKey: 'iso', text: s.txtIso });
            if(s.showFocal) items.push({ type: 'row', iconKey: 'focal', text: s.txtFocal });
            
            const hasTop = items.length > 0;
            const bottomItems = [];
            if(s.showDesc && s.txtDesc) bottomItems.push({ type: 'text', text: s.txtDesc, bold: true });
            if(s.showDate) bottomItems.push({ type: 'row', iconKey: 'clock', text: s.txtDate });
            if(s.showCamera) bottomItems.push({ type: 'row', iconKey: 'camera', text: s.txtCamera });
            if(s.showLens) bottomItems.push({ type: 'row', iconKey: 'lens', text: s.txtLens });
            
            if(hasTop && bottomItems.length > 0) items.push({ type: 'divider' });
            items.push(...bottomItems);

            if(s.showCopyright) {
                if(items.length > 0) items.push({ type: 'spacer', height: rowHeight * 0.5 });
                items.push({ type: 'copyright', text: s.copyright });
            }

            if(items.length > 0) {
                tCtx.font = `${fontSize}px "Noto Sans", sans-serif`;
                let maxTextWidth = 0;
                let contentHeight = padding * 2;

                items.forEach(item => {
                    if(item.type === 'row') {
                        const tw = tCtx.measureText(item.text).width;
                        maxTextWidth = Math.max(maxTextWidth, iconSize + gap + tw);
                        contentHeight += rowHeight;
                    } else if (item.type === 'text') {
                        tCtx.save();
                        if(item.bold) tCtx.font = `bold ${fontSize}px "Noto Sans", sans-serif`;
                        const tw = tCtx.measureText(item.text).width;
                        maxTextWidth = Math.max(maxTextWidth, tw);
                        tCtx.restore();
                        contentHeight += rowHeight;
                    } else if (item.type === 'divider') {
                        contentHeight += rowHeight;
                    } else if (item.type === 'spacer') {
                        contentHeight += item.height;
                    } else if (item.type === 'copyright') {
                        tCtx.save();
                        tCtx.font = `${fontSize * 0.7}px "Noto Sans", sans-serif`;
                        const tw = tCtx.measureText(item.text).width;
                        maxTextWidth = Math.max(maxTextWidth, tw);
                        tCtx.restore();
                        contentHeight += (rowHeight * 0.8);
                    }
                });

                const cardWidth = Math.max(minDim * 0.35, maxTextWidth + (padding * 2));
                const margin = minDim * 0.04;
                let startX, startY;

                switch(s.position) {
                    case 'top-left': startX = margin; startY = margin; break;
                    case 'top-right': startX = w - cardWidth - margin; startY = margin; break;
                    case 'bottom-right': startX = w - cardWidth - margin; startY = h - contentHeight - margin; break;
                    case 'bottom-left': startX = margin; startY = h - contentHeight - margin; break;
                    default: startX = margin; startY = h - contentHeight - margin;
                }

                tCtx.save();
                tCtx.fillStyle = s.cardColor;
                tCtx.globalAlpha = s.cardOpacity / 100;
                const r = s.cardRounding * 2 * baseScale;
                tCtx.beginPath();
                tCtx.roundRect(startX, startY, cardWidth, contentHeight, r);
                tCtx.fill();
                tCtx.restore();

                let currentY = startY + padding + (rowHeight/2);
                tCtx.fillStyle = s.textColor;
                tCtx.textAlign = 'left';
                tCtx.textBaseline = 'middle';

                items.forEach(item => {
                    const x = startX + padding;
                    if(item.type === 'row') {
                        if(item.iconKey === 'clock') {
                             tCtx.strokeStyle = s.accentColor;

                             tCtx.lineTo(x + iconSize/2, currentY - (iconSize/3));
                             tCtx.moveTo(x + iconSize/2, currentY);
                             tCtx.lineTo(x + iconSize/2 + (iconSize/4), currentY);
                             tCtx.stroke();

                            try { 
                                const tCanvas = document.createElement('canvas');

                                tCtxIcon.fillStyle = s.accentColor;

                        currentY += (rowHeight * 0.8);
                    }
                });
            }

            const blob = await new Promise(resolve => tempCanvas.toBlob(resolve, 'image/jpeg', 0.90));
            zip.file(`fusedframe-${i+1}.jpg`, blob);
            await new Promise(r => setTimeout(r, 10));
        }

        processingText.innerText = "Zipping...";
        const content = await zip.generateAsync({type:"blob"});
        saveAs(content, "fusedframe-overlays.zip");
        processingOverlay.classList.add('hidden');
    }

    function clearAll() {
        if(!confirm("Remove all images?")) return;
        images = [];
        selectedId = null;
        filmstrip.innerHTML = '';
        controlsContainer.classList.add('hidden');
        canvas.classList.add('hidden');
        noImageMsg.classList.remove('hidden');
        emptyState.classList.remove('hidden');
        updateCounter();
    }

    function updateCounter() {
        statusCounter.innerText = `${images.length} images`;
    }
